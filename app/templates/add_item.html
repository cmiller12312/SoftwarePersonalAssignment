
<!DOCTYPE html>
<html>
<head>
    {% load static %}
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>

<body>
    <div class="item">
        <h1>Add a New Item</h1>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}

            <button type="submit" class="buy-button">
                Add Item
            </button>
        </form>

        <a class="back-link" href="/">Back to Store</a>
    </div>
</body>
</html>
