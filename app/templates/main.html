<!DOCTYPE html>
<html>
<head>
    <title>My Mock Store</title>
</head>
<body>
    <h1>My Mock Store</h1>

    {% for item in items %}
        <div>
            <h2>{{ item.name }}</h2>
            <p>{{ item.description }}</p>
            <p>${{ item.price }}</p>
            <p>In stock: {{ item.stock }}</p>
        </div>
    {% empty %}
        <p>No items available yet.</p>
    {% endfor %}
</body>
</html>
