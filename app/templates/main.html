
<!DOCTYPE html>
<html>
<head>
    {% load static %}
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>

<body>
    <a class="add-button" href="{% url 'add_item' %}">
        Add New Item
    </a>

    <div class="items">
        {% for item in items %}
            <div class="item">
                <h2>{{ item.name }}</h2>

                <p>{{ item.description }}</p>

                <p class="price">${{ item.price }}</p>

                {% if item.stock > 0 %}
                    <p>In stock: {{ item.stock }}</p>
                    <a class="add-button"
                       href="{% url 'item_detail' item.name %}">
                        Buy
                    </a>
                {% else %}
                    <p>Out of stock</p>
                {% endif %}
            </div>
        {% empty %}
            <p>No items available yet.</p>
        {% endfor %}
    </div>
</body>
</html>
